<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
</head>

<body>

    <h1>Registration Form</h1>

    <form>

        <!-- First Name -->
        <label>First Name :</label>
        <input type="text" placeholder="Enter First Name">
        <br><br>

        <!-- Last Name -->
        <label>Last Name :</label>
        <input type="text" placeholder="Enter Last Name">
        <br><br>

        <!-- Email -->
        <label>Email :</label>
        <input type="email" placeholder="Enter Email Address">
        <br><br>

        <!-- Password -->
        <label>Password :</label>
        <input type="password">
        <br><br>

        <!-- Gender -->
        <label>Gender:</label>
        <br>

        <label>
            <input type="radio" name="gender" value="male">
            Male
        </label>
        <br>

        <label>
            <input type="radio" name="gender" value="female">
            Female
        </label>
        <br>

        <label>
            <input type="radio" name="gender" value="other">
            Other
        </label>
        <br><br>

        <!-- Age -->
        <label>Age :</label>
        <input type="number">
        <br><br>

        <!-- Preferences -->
        <label>Preferences :</label>
        <br>

        <label>
            <input type="checkbox" name="preference" value="acrylic">
            Acrylic Painting
        </label>
        <br>

        <label>
            <input type="checkbox" name="preference" value="oil">
            Oil Painting
        </label>
        <br>

        <label>
            <input type="checkbox" name="preference" value="water">
            Water Color Painting
        </label>
        <br><br>

        <!-- Occupation -->
        <label>Select Occupation</label>

        <select>
            <option>Student</option>
            <option>Teacher</option>
            <option>Engineer</option>
            <option>Other</option>
        </select>

        <br><br>

        <!-- Bio -->
        <label>Bio</label>
        <br>

        <textarea rows="8" cols="50"
            placeholder="Share few lines about yourself..."></textarea>

        <br><br>

        <!-- Buttons -->
        <input type="reset" value="RESET">
        <input type="submit" value="SUBMIT">

    </form>

</body>
</html>
