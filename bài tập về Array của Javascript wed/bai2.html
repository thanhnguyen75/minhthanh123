<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 2 - sumOddNumbers</title>
</head>

<body>
    <h2>Bài 2: Tính tổng số lẻ</h2>
    <p>Mảng: [1, 2, 3, 4, 5]</p>
    <button onclick="chayBai()">Chạy bài</button>
    <p id="ketqua"></p>

    <script>
        function sumOddNumbers(arr) {
            let sum = 0;

            for (let i = 0; i < arr.length; i++) {
                if (arr[i] % 2 !== 0) sum += arr[i];
            }
            return sum;
        }

        function chayBai() {
            document.getElementById("ketqua").textContent =
                "Kết quả: " + sumOddNumbers([1, 2, 3, 4, 5]);
        }
    </script>
</body>

</html>
