<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 10 - sumOfSquares</title>
</head>

<body>
    <h2>Bài 10: Tổng bình phương</h2>
    <p>Mảng: [1, 2, 3]</p>
    <button onclick="chayBai()">Chạy bài</button>
    <p id="ketqua"></p>

    <script>
        function sumOfSquares(arr) {
            let sum = 0;

            for (let i = 0; i < arr.length; i++) {
                sum += arr[i] * arr[i];
            }
            return sum;
        }

        function chayBai() {
            document.getElementById("ketqua").textContent =
                "Kết quả: " + sumOfSquares([1, 2, 3]);
        }
    </script>
</body>

</html>
