<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 9 - alternateSum</title>
</head>

<body>
    <h2>Bài 9: Tính tổng xen kẽ</h2>
    <p>Mảng: [10, 5, 6, 3]</p>
    <button onclick="chayBai()">Chạy bài</button>
    <p id="ketqua"></p>

    <script>
        function alternateSum(arr) {
            let sum = 0;

            for (let i = 0; i < arr.length; i++) {
                if (i % 2 === 0) {
                    sum += arr[i];
                } else {
                    sum -= arr[i];
                }
            }
            return sum;
        }

        function chayBai() {
            document.getElementById("ketqua").textContent =
                "Kết quả: " + alternateSum([10, 5, 6, 3]);
        }
    </script>
</body>

</html>
