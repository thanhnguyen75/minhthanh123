<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 3 - findMin</title>
</head>

<body>
    <h2>Bài 3: Tìm số nhỏ nhất</h2>
    <p>Mảng: [5, 2, 8, 1, 4]</p>
    <button onclick="chayBai()">Chạy bài</button>
    <p id="ketqua"></p>

    <script>
        function findMin(arr) {
            if (arr.length === 0) return undefined;
            let min = arr[0];

            for (let i = 1; i < arr.length; i++) {
                if (arr[i] < min) min = arr[i];
            }
            return min;
        }

        function chayBai() {
            document.getElementById("ketqua").textContent =
                "Kết quả: " + findMin([5, 2, 8, 1, 4]);
        }
    </script>
</body>

</html>
