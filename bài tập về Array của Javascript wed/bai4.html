<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 4 - countPositiveNumbers</title>
</head>

<body>
    <h2>Bài 4: Đếm số dương</h2>
    <p>Mảng: [-1, 2, 3, -4, 5]</p>
    <button onclick="chayBai()">Chạy bài</button>
    <p id="ketqua"></p>

    <script>
        function countPositiveNumbers(arr) {
            let count = 0;

            for (let i = 0; i < arr.length; i++) {
                if (arr[i] > 0) count++;
            }
            return count;
        }

        function chayBai() {
            document.getElementById("ketqua").textContent =
                "Kết quả: " +
                countPositiveNumbers([-1, 2, 3, -4, 5]);
        }
    </script>
</body>

</html>
