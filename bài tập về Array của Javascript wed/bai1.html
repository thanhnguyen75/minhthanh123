<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 1 - Tìm số lớn nhất</title>
</head>

<body>
    <h2>Bài 1: Tìm số lớn nhất</h2>

    <p>Mảng: [1, 3, 5, 7, 9]</p>

    <button onclick="chayBai()">Chạy bài</button>

    <p id="ketqua"></p>

    <script>
        function findMax(arr) {
            let max = arr[0];

            for (let i = 1; i < arr.length; i++) {
                if (arr[i] > max) {
                    max = arr[i];
                }
            }

            return max;
        }

        function chayBai() {
            let arr = [1, 3, 5, 7, 9];
            let ketqua = findMax(arr);

            document.getElementById("ketqua").innerHTML =
                "Kết quả: " + ketqua;
        }
    </script>
</body>

</html>
