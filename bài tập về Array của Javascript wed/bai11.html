<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 11 - filterEvensAndSum</title>
</head>

<body>
    <h2>Bài 11: Tổng các số chẵn</h2>
    <p>Mảng: [1, 2, 3, 4, 5, 6]</p>
    <button onclick="chayBai()">Chạy bài</button>
    <p id="ketqua"></p>

    <script>
        function filterEvensAndSum(arr) {
            let sum = 0;

            for (let i = 0; i < arr.length; i++) {
                if (arr[i] % 2 === 0) sum += arr[i];
            }
            return sum;
        }

        function chayBai() {
            document.getElementById("ketqua").textContent =
                "Kết quả: " +
                filterEvensAndSum([1, 2, 3, 4, 5, 6]);
        }
    </script>
</body>

</html>
