<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 16 - findPairsWithSum</title>
</head>

<body>
    <h2>Bài 16: Tìm cặp số có tổng bằng sum</h2>
    <p>Mảng: [1, 2, 3, 4, 5]</p>
    <p>sum = 5</p>
    <button onclick="chayBai()">Chạy bài</button>
    <p id="ketqua"></p>

    <script>
        function findPairsWithSum(arr, sum) {
            let result = [];

            for (let i = 0; i < arr.length; i++) {
                for (let j = i + 1; j < arr.length; j++) {
                    if (arr[i] + arr[j] === sum) {
                        result.push([arr[i], arr[j]]);
                    }
                }
            }
            return result;
        }

        function chayBai() {
            document.getElementById("ketqua").textContent =
                "Kết quả: " +
                JSON.stringify(findPairsWithSum([1, 2, 3, 4, 5], 5));
        }
    </script>
</body>

</html>
