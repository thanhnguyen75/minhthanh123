<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thông tin thành viên</title>
</head>

<body>
    <h2>PHIẾU ĐĂNG KÝ</h2>

    <form>
        Họ và tên:
        <input type="text" required><br><br>

        Địa chỉ:
        <input type="text" size="35"><br><br>

        Email:
        <input type="email" required><br><br>

        Giới tính:
        <input type="radio" name="gioitinh"> Nam
        <input type="radio" name="gioitinh"> Nữ
        <br><br>

        Tuổi:
        <input type="number" required><br><br>

        Sở thích:<br>
        <input type="checkbox"> Thể thao<br>
        <input type="checkbox"> Văn học<br>
        <input type="checkbox"> Công nghệ thông tin<br>
        <input type="checkbox"> Lịch sử<br>
        <input type="checkbox"> Game
        <br><br>

        Chuyên ngành:
        <select>
            <option>Công nghệ Web</option>
            <option>Lập trình</option>
            <option>Mạng máy tính</option>
        </select>
        <br><br>

        Gửi hình:
        <input type="file">
        <br><br>

        Yêu cầu:<br>
        <textarea rows="5" cols="30"></textarea>
        <br><br>

        <input type="submit" value="Gửi thông tin">
        <input type="reset" value="Nhập lại">
    </form>
</body>
</html>
