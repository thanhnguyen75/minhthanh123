<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 3 - Xếp loại</title>
</head>
<body>
    <h2>Xếp loại học lực</h2>

    <input type="number" id="diem" placeholder="Nhập điểm 0-100">
    <button onclick="xepLoai()">Xếp loại</button>

    <p id="ketqua"></p>

    <script>
        function xepLoai() {
            let s = document.getElementById("diem").value;
            let diem = Number(s);
            let loai;

            if (s === "" || diem < 0 || diem > 100) {
                document.getElementById("ketqua").innerText =
                    "Điểm không hợp lệ!";
                return;
            }

            if (diem >= 90) {
                loai = "A";
            } else if (diem >= 80) {
                loai = "B";
            } else if (diem >= 70) {
                loai = "C";
            } else if (diem >= 60) {
                loai = "D";
            } else {
                loai = "F";
            }

            document.getElementById("ketqua").innerText =
                "Xếp loại: " + loai;
        }
    </script>
</body>
</html>
